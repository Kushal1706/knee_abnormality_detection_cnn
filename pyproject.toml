[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-abnormality-detection"
version = "0.1.0"
description = "prototype for multi-task knee MRI classification using a multi-view CNN"
requires-python = ">=3.12,<3.13"
dependencies = [
    "iterative-stratification==0.1.9",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "torch==2.14.1",
]

[project.optional-dependencies]
download = [
    "redivis",
    "requests",
]
dev = [
    "pytest==9.1.1",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"